# Local development databases for Buzrr.
#
# Brings up PostgreSQL and Redis in containers so you don't need to install or
# provision either service on your machine. The app itself runs on the host
# (`yarn dev`) for fast hot-reload.
#
# Quick start (from the repo root):
#
#     yarn setup      # creates .env files, starts these containers, pushes the schema
#     yarn dev        # runs web (:3000) + server (:3001) on the host
#
# Or manage the containers directly:
#
#     docker compose up -d     # start Postgres + Redis in the background
#     docker compose down      # stop them (data is preserved in named volumes)
#     docker compose down -v   # stop them and wipe all data
#
# Credentials are intentionally simple/local-only — never reuse them in production.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: buzrr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buzrr
      POSTGRES_PASSWORD: buzrr
      POSTGRES_DB: buzrr
    ports:
      - "5432:5432"
    volumes:
      - buzrr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzrr -d buzrr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: buzrr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - buzrr-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  # The AI service is behind a profile so `docker compose up -d` (and `yarn
  # setup`) stay exactly as they were for contributors who aren't touching it.
  #   docker compose --profile ai up -d
  ai:
    profiles: ["ai"]
    build:
      context: ./apps/ai
    container_name: buzrr-ai
    restart: unless-stopped
    env_file: apps/ai/.env
    environment:
      AI_DATABASE_URL: postgresql://buzrr:buzrr@postgres:5432/buzrr
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    profiles: ["ai"]
    build:
      context: ./apps/ai
    container_name: buzrr-ai-worker
    restart: unless-stopped
    command: ["arq", "buzrr_ai.worker.WorkerSettings"]
    env_file: apps/ai/.env
    environment:
      AI_DATABASE_URL: postgresql://buzrr:buzrr@postgres:5432/buzrr
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  buzrr-postgres-data:
  buzrr-redis-data:
