[project]
name = "buzrr-ai"
version = "0.1.0"
description = "Buzrr-AI — Knowledge Spaces, document ingestion and RAG quiz generation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "google-genai>=0.8",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buzrr_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
packages = ["buzrr_ai"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf.*", "docx.*", "pgvector.*", "arq.*", "google.genai.*"]
ignore_missing_imports = true

# PyMuPDF ships partial annotations: the module resolves, but its methods are
# untyped, so strict mode flags every call. Scoped to the one module that uses it.
[[tool.mypy.overrides]]
module = ["buzrr_ai.ingestion.parsers.pdf"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
