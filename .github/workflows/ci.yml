name: CI

# Runs on every push and PR. Vercel is configured to wait for this workflow to
# succeed before it builds/promotes a deployment (Settings → Git → "Wait for CI").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repo; never expose a writable token to build steps.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    # Real databases so the Next.js build (and any schema work) behaves like prod.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: buzrr
          POSTGRES_PASSWORD: buzrr
          POSTGRES_DB: buzrr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buzrr -d buzrr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Non-secret, CI-only values. Real credentials live in Vercel/host env.
      DATABASE_URL: postgresql://buzrr:buzrr@localhost:5432/buzrr
      DIRECT_URL: postgresql://buzrr:buzrr@localhost:5432/buzrr
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-build-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      RATELIMIT: "OFF"
      NEXT_PUBLIC_AI_API_URL: http://localhost:3002

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Full package build (generate + tsc): apps resolve @buzrr/prisma types
      # from its dist/, which a fresh checkout doesn't have.
      - name: Build Prisma package
        run: yarn workspace @buzrr/prisma build

      - name: Sync database schema
        run: yarn prisma db push --url "$DATABASE_URL"

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn check-types

      - name: Build
        run: yarn build

  verify-docker-setup:
    name: Verify Docker dev setup
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires these at load time — the @buzrr/prisma
      # postinstall (prisma generate) runs during `yarn install`, before any
      # .env exists in a fresh checkout.
      DATABASE_URL: postgresql://buzrr:buzrr@localhost:5432/buzrr
      DIRECT_URL: postgresql://buzrr:buzrr@localhost:5432/buzrr
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Start Postgres + Redis via docker compose
        run: docker compose up -d

      - name: Wait for Postgres health
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' buzrr-postgres)" = "healthy" ]; then
              echo "Postgres healthy"; exit 0
            fi
            sleep 2
          done
          echo "Postgres never became healthy"; docker compose logs postgres; exit 1

      - name: Push schema into the container (matches `yarn setup`)
        run: yarn prisma db push --url "postgresql://buzrr:buzrr@localhost:5432/buzrr"

      - name: Tear down
        if: always()
        run: docker compose down -v

  python-ai:
    name: Buzrr-AI (lint, types, tests)
    runs-on: ubuntu-latest

    # pgvector, not plain postgres: the AI schema has a vector column and an HNSW
    # index, and the integration tests exercise both.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: buzrr
          POSTGRES_PASSWORD: buzrr
          POSTGRES_DB: buzrr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buzrr -d buzrr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AI_DATABASE_URL: postgresql://buzrr:buzrr@localhost:5432/buzrr
      # Test setup drops and recreates the `ai` schema. This service container is
      # disposable, so it can be the target directly; locally the suite defaults
      # to a separate `<database>_test` instead of eating your dev data.
      AI_TEST_DATABASE_URL: postgresql://buzrr:buzrr@localhost:5432/buzrr
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-build-secret-not-used-in-production
      # Never used: both providers are faked in tests.
      GEMINI_API_KEY: ci-dummy-key
      AI_WEB_ORIGIN: http://localhost:3000
      AI_TMP_DIR: /tmp/buzrr-ai-ci

    defaults:
      run:
        working-directory: apps/ai

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src alembic tests

      - name: Format check
        run: python -m ruff format --check src alembic tests

      - name: Type-check
        run: python -m mypy src

      - name: Verify migrations apply from scratch
        run: python -m alembic upgrade head

      - name: Test
        run: python -m pytest -q
